controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:

    left_wheel_names:
      - joint_BL
      - joint_FL

    right_wheel_names:
      - joint_BR
      - joint_FR

    wheel_separation: 0.8112
    wheel_radius: 0.2

    odom_frame_id: odom
    base_frame_id: base_link

    publish_rate: 50.0
    enable_odom_tf: true

    pose_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001

    twist_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001

    use_stamped_vel: false